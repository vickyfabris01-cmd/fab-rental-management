<!-- index.html (project root) — MODIFIED FILE
     Changes: (1) Inter added to the font link, old fonts kept until old pages are migrated;
              (2) theme boot script added; (3) inline <style> block removed, its reset and
              scrollbar rules now live in src/styles/base.css and read from tokens.css. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta (name and logo are placeholders until the final brand is agreed) -->
    <title>BizKenia — Manage and grow your business</title>
    <meta name="description" content="BizKenia — manage your rental, shop or farm business in one place, and be found by customers across Kenya." />
    <meta name="theme-color" content="#16A34A" />

    <!-- Favicon (replace with real .ico / .png in production) -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-icon.svg" />

    <!-- Theme boot: sets data-theme BEFORE first paint so there is no flash.
         Values: "light" | "dark" | "system". Default is "light" while old pages are
         being migrated; change the default to "system" when the last old page is gone.
         The theme toggle (built in the components step) writes to the same key. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("app-theme");
          if (saved === "light" || saved === "dark" || saved === "system") theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <!-- Google Fonts — loaded here so they're available before first paint.
         Inter is the new UI font. Playfair Display and DM Sans/DM Mono stay only because
         old pages still use them; remove them when those pages are rebuilt. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title"       content="BizKenia" />
    <meta property="og:description" content="Manage and grow your business in Kenya." />
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://fabrentals.co.ke" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects the module script tag here -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
